<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .brand-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 28px;
        font-weight: 800;
        fill: #c9a84c;
        letter-spacing: -0.5px;
        text-anchor: middle;
      }
      .brand-accent {
        font-size: 32px;
        font-weight: 900;
      }
    </style>
  </defs>

  <!-- Fondo sutil -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

  <!-- Texto principal -->
  <text x="100" y="110" class="brand-text">
    <tspan class="brand-accent">B</tspan>arber<tspan class="brand-accent">F</tspan>low
  </text>
</svg>