<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.6"/>

  <!-- Grupo de herramientas de barbería -->
  <g transform="translate(100, 100)">
    <!-- Tijeras izquierdas (arriba) -->
    <g transform="rotate(-35)">
      <circle cx="-15" cy="-35" r="8" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
      <circle cx="15" cy="-35" r="8" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
      <path d="M -15 -27 Q 0 -15 15 -27" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Navaja derecha (abajo) -->
    <g transform="rotate(35)">
      <path d="M 8 -40 L 18 20 Q 18 25 12 28 Q 8 28 8 24 L 8 -40" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="-40" r="6" fill="none" stroke="#c9a84c" stroke-width="2"/>
    </g>

    <!-- Peine (en el medio) -->
    <g transform="translate(-5, 5)">
      <rect x="-3" y="-25" width="6" height="35" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="-5" x2="2" y2="-5" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="5" x2="2" y2="5" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="15" x2="2" y2="15" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Texto "BarberFlow" minimalista -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#c9a84c" letter-spacing="2">
      BARBERFLOW
    </text>
  </g>
</svg>